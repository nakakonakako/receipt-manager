name: Preflight AI quota migration privileges

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight AI quota migration privileges
    runs-on: ubuntu-latest
    env:
      PGPORT: "5432"
      PGDATABASE: postgres
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Require main branch for production preflight
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "AI quota migration privilege preflight failed closed: ref must be refs/heads/main." >&2
            exit 1
          fi

      - name: Require pooler host and existing database secrets
        env:
          PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
          PROD_SUPABASE_PROJECT_ID: ${{ secrets.PROD_SUPABASE_PROJECT_ID }}
          PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PGHOST}" || "${PGHOST}" =~ [[:space:]] ]]; then
            echo "Repository or organization variable PROD_SUPABASE_POOLER_HOST must be set to the Supabase session pooler hostname. This repository does not contain a host." >&2
            exit 1
          fi
          if [[ -z "${PROD_SUPABASE_PROJECT_ID}" || -z "${PROD_SUPABASE_DB_PASSWORD}" ]]; then
            echo "Existing secrets PROD_SUPABASE_PROJECT_ID and PROD_SUPABASE_DB_PASSWORD are required. No new secret is used." >&2
            exit 1
          fi
          if [[ ! "${PROD_SUPABASE_PROJECT_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "PROD_SUPABASE_PROJECT_ID has an unexpected format." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Run AI quota migration privilege preflight
        env:
          PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
          PGUSER: postgres.${{ secrets.PROD_SUPABASE_PROJECT_ID }}
          PGPASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "AI quota migration privilege preflight failed." >&2
            exit 1
          fi
          if psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/preflight_ai_quota_migration_privileges.sql >/dev/null 2>&1; then
            echo "AI quota migration privilege preflight succeeded."
          else
            echo "AI quota migration privilege preflight failed." >&2
            exit 1
          fi
