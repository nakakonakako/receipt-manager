name: Bootstrap production DB reader

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type bootstrap-reader-20261027150000 to run the one-time bootstrap
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: receipt-manager-production-db
  cancel-in-progress: false
  queue: max

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: production-db-apply
    env:
      BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
      PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.MIGRATION_SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require explicit bootstrap and latest main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$BOOTSTRAP_CONFIRMATION" != bootstrap-reader-20261027150000 ]]; then
            echo "Bootstrap requires main and the exact confirmation input." >&2
            exit 1
          fi
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          if [[ -z "$PGHOST" || "$PGHOST" =~ [[:space:]] || -z "$PGPASSWORD" || ! "$PROJECT_REF" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "Protected production DB apply environment is incomplete." >&2
            exit 1
          fi
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Require exact one-time bootstrap state
        id: state
        run: python3 scripts/check-production-db-state.py --base-ref "$GITHUB_SHA" --bootstrap-version 20261027150000 --output "$GITHUB_OUTPUT"
      - name: Verify first-apply prerequisites
        if: ${{ steps.state.outputs.bootstrap_action == 'apply' }}
        run: psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/preflight_migration_reader_bootstrap.sql >/dev/null
      - name: Classify existing RPC and ACL integrity
        run: |
          set -euo pipefail
          python3 scripts/verify-production-db-integrity.py --output "$RUNNER_TEMP/bootstrap-integrity-before"
          if grep -qx 'result=MISMATCH' "$RUNNER_TEMP/bootstrap-integrity-before"; then
            echo "Existing RPC/ACL mismatch recorded; only the protected reader bootstrap may continue. Application build/deploy remains blocked until a forward repair passes postflight."
          fi
      - name: Recheck bootstrap migration before apply
        if: ${{ steps.state.outputs.bootstrap_action == 'apply' }}
        run: |
          set -euo pipefail
          python3 scripts/check-production-db-state.py --base-ref "$GITHUB_SHA" --bootstrap-version 20261027150000 --output "$RUNNER_TEMP/bootstrap-state"
          grep -qx 'bootstrap_action=apply' "$RUNNER_TEMP/bootstrap-state"
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Prepare bootstrap database URL
        if: ${{ steps.state.outputs.bootstrap_action == 'apply' }}
        run: python3 scripts/write-supabase-db-url.py --output "$GITHUB_ENV"
      - name: Apply the reader bootstrap migration
        if: ${{ steps.state.outputs.bootstrap_action == 'apply' }}
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Restore the preflighted ADMIN-only executor membership
        if: ${{ steps.state.outputs.bootstrap_action == 'apply' }}
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          psql -X -w -v ON_ERROR_STOP=1 -c \
            'GRANT ai_quota_owner TO postgres WITH ADMIN TRUE, SET FALSE, INHERIT FALSE' >/dev/null
      - name: Recheck exact bootstrap migration history
        id: final_state
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/check-production-db-state.py --base-ref "$GITHUB_SHA" --bootstrap-version 20261027150000 --output "$RUNNER_TEMP/bootstrap-final-state"
          grep -qx 'state=BOOTSTRAP_APPLIED' "$RUNNER_TEMP/bootstrap-final-state"
          grep -qx 'bootstrap_action=verify' "$RUNNER_TEMP/bootstrap-final-state"
      - name: Verify reader group and ADMIN-only owner membership
        run: |
          set -euo pipefail
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_reader_bootstrap.sql >/dev/null
      - name: Record remaining RPC and ACL integrity
        run: |
          set -euo pipefail
          python3 scripts/verify-production-db-integrity.py --output "$RUNNER_TEMP/bootstrap-integrity-after"
          if grep -qx 'result=MISMATCH' "$RUNNER_TEMP/bootstrap-integrity-after"; then
            echo "Reader bootstrap is verified; RPC/ACL mismatch remains and must be repaired by an approved forward migration before application delivery."
          fi
