name: Verify production database integrity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify migration history, reader, RPC, AI quota, and ACLs
    runs-on: ubuntu-latest
    environment:
      name: production-db-check
    env:
      PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: migration_preflight_login.${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Require main and configured read-only credential
        env:
          READER_PASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
          PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || -z "$PGHOST" || "$PGHOST" =~ [[:space:]] || ! "$PROJECT_REF" =~ ^[A-Za-z0-9]+$ || -z "$READER_PASSWORD" ]]; then
            echo "Production DB check environment is missing or this is not main." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Require migration history in sync
        run: |
          set -euo pipefail
          python3 scripts/check-production-db-state.py --base-ref "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
          grep -Fxq 'state=IN_SYNC' "$GITHUB_OUTPUT"
      - name: Verify reader and database integrity
        run: |
          set -euo pipefail
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_production_db_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_reader_bootstrap.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_s1_08_rpc_integrity.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_s1_06_ai_quota_integrity.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_s1_f01_acl_integrity.sql >/dev/null
