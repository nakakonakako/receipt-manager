name: Verify production S1-08 RPCs

on:
  workflow_call:
    secrets:
      PROD_SUPABASE_DB_PASSWORD:
        required: true
      PROD_SUPABASE_PROJECT_ID:
        required: true
  workflow_dispatch:

jobs:
  verify:
    name: Verify production RPC definitions
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.${{ secrets.PROD_SUPABASE_PROJECT_ID }}
      PGPASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
    steps:
      - name: Require main branch for production verification
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production verification must run from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify psql is available
        run: psql --version

      - name: Run read-only S1-08 verification
        run: >-
          psql -X -w -v ON_ERROR_STOP=1
          -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          -f supabase/diagnostics/verify_s1_08_rpc_integrity.sql
