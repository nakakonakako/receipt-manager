name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production DB checks and deployments share this queue.
concurrency:
  group: receipt-manager-production-db
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --directory backend --frozen
      - name: Run quality checks
        run: npm run check

  preflight:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production-db-check
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install Git and PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git postgresql-client
          command -v git
          command -v psql
          python3 --version
          git --version
          psql --version
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Verify shared production DB contract
        uses: nakakonakako/shared-supabase-db/.github/actions/consumer-production-db-check@c06454f78cc3db27964829fd0e357cbb0d3536f8
        with:
          app-id: receipt-manager
          app-commit-sha: ${{ github.sha }}
          reader-pooler-host: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
          reader-project-ref: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
          reader-username: migration_preflight_login.${{ vars.PROD_SUPABASE_PROJECT_REF }}
          reader-password: ${{ secrets.MIGRATION_READER_PASSWORD }}

  integrity:
    needs: [quality, preflight]
    runs-on: ubuntu-latest
    environment:
      name: production-db-check
    env:
      PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: migration_preflight_login.${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Verify Reader login privileges and bootstrap role
        run: |
          set -euo pipefail
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_production_db_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_reader_bootstrap.sql >/dev/null
      - name: Verify current RPC, AI quota, and ACL integrity
        run: |
          set -euo pipefail
          python3 scripts/verify-production-db-integrity.py --output "$RUNNER_TEMP/integrity-result"
          grep -Fxq 'result=PASS' "$RUNNER_TEMP/integrity-result"

  build-and-push:
    needs: [quality, preflight, integrity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Docker Setup
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build/Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            VITE_API_URL=/api
      - name: Build/Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: [quality, preflight, integrity, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require latest main commit before deployment
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: SCP Transfer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.production.yml, nginx-config"
          target: "~/receipt-manager"
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash <<'DEPLOY'
            set -euo pipefail
            cd ~/receipt-manager

            umask 077
            if [[ -L .env || ( -e .env && ! -f .env ) ]]; then
              echo ".env must be a regular file" >&2
              exit 1
            fi
            if [[ -e .env ]]; then
              chmod 600 -- .env
              if [[ "$(stat -c '%a' -- .env)" != 600 ]]; then
                echo ".env permissions are not 0600" >&2
                exit 1
              fi
            fi

            env_tmp="$(mktemp ./.env.tmp.XXXXXX)"
            trap 'rm -f -- "$env_tmp"' EXIT
            cat > "$env_tmp" <<'EOF'
            GEMINI_API_KEY=${{ secrets.PROD_GEMINI_API_KEY }}
            SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            EOF
            chmod 600 -- "$env_tmp"
            if [[ "$(stat -c '%a' -- "$env_tmp")" != 600 ]]; then
              echo "temporary .env permissions are not 0600" >&2
              exit 1
            fi
            mv -fT -- "$env_tmp" .env

            if [[ "$(stat -c '%a' -- .env)" != 600 ]]; then
              echo ".env permissions are not 0600" >&2
              exit 1
            fi

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
            for container in receipt-frontend receipt-backend; do
              status=$(docker inspect --format '{{.State.Status}}' "$container")
              if [[ "$status" != running ]]; then
                echo "$container is $status" >&2
                exit 1
              fi
            done
            docker image prune -f
            DEPLOY
