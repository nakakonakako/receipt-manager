name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All production DB checks, migration applies, and deployments share this queue.
concurrency:
  group: receipt-manager-production-db
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --directory backend --frozen
      - name: Run quality checks
        run: npm run check

  preflight:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production-db-check
    env:
      PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: migration_preflight_login.${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    outputs:
      state: ${{ steps.history.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit and reader environment
        env:
          READER_PASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
          PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          if [[ "$GITHUB_REF" != refs/heads/main || -z "$PGHOST" || "$PGHOST" =~ [[:space:]] || ! "$PROJECT_REF" =~ ^[A-Za-z0-9]+$ || -z "$READER_PASSWORD" ]]; then
            echo "Production DB reader environment is missing or this is not main; deployment is blocked." >&2
            exit 1
          fi
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Compare migration history with main
        id: history
        run: python3 scripts/check-production-db-state.py --base-ref "${{ github.event.before || github.sha }}" --output "$GITHUB_OUTPUT"
      - name: Verify reader role and production database baseline
        run: |
          set -euo pipefail
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_production_db_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_reader_bootstrap.sql >/dev/null

  integrity:
    needs: [quality, preflight]
    if: ${{ always() && needs.quality.result == 'success' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production-db-check
    env:
      PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: migration_preflight_login.${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    outputs:
      result: ${{ steps.integrity.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Verify current RPC and ACL integrity
        id: integrity
        run: python3 scripts/verify-production-db-integrity.py --output "$GITHUB_OUTPUT"

  apply:
    needs: [quality, preflight, integrity]
    if: ${{ always() && needs.quality.result == 'success' && needs.preflight.result == 'success' && needs.preflight.outputs.state == 'PENDING' && needs.integrity.result == 'success' && (needs.integrity.outputs.result == 'PASS' || needs.integrity.outputs.result == 'MISMATCH') }}
    runs-on: ubuntu-latest
    environment:
      name: production-db-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require latest main commit and writer environment
        env:
          DB_PASSWORD: ${{ secrets.MIGRATION_SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
          POOLER_HOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          if [[ "$GITHUB_REF" != refs/heads/main || -z "$DB_PASSWORD" || ! "$PROJECT_REF" =~ ^[A-Za-z0-9]+$ || -z "$POOLER_HOST" ]]; then
            echo "Production DB apply environment is incomplete; migration is blocked." >&2
            exit 1
          fi
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Recheck pending history after approval
        id: pending
        env:
          PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres.${{ vars.PROD_SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.MIGRATION_SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/check-production-db-state.py --base-ref "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
          grep -qx 'state=PENDING' "$GITHUB_OUTPUT"
      - name: Apply pending main migrations
        env:
          PGHOST: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres.${{ vars.PROD_SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.MIGRATION_SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/write-supabase-db-url.py --output "$GITHUB_ENV"
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  postflight:
    needs: [quality, preflight, integrity, apply]
    if: ${{ always() && needs.quality.result == 'success' && needs.preflight.result == 'success' && needs.preflight.outputs.state == 'PENDING' && needs.integrity.result == 'success' && needs.apply.result == 'success' }}
    uses: ./.github/workflows/verify-production-rpcs.yml

  build-and-push:
    needs: [quality, preflight, integrity, apply, postflight]
    if: ${{ always() && needs.quality.result == 'success' && needs.preflight.result == 'success' && ((needs.preflight.outputs.state == 'IN_SYNC' && needs.integrity.result == 'success' && needs.integrity.outputs.result == 'PASS' && needs.apply.result == 'skipped' && needs.postflight.result == 'skipped') || (needs.preflight.outputs.state == 'PENDING' && needs.integrity.result == 'success' && (needs.integrity.outputs.result == 'PASS' || needs.integrity.outputs.result == 'MISMATCH') && needs.apply.result == 'success' && needs.postflight.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: Docker Setup
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build/Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            VITE_API_URL=/api
      - name: Build/Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: [quality, preflight, integrity, apply, postflight, build-and-push]
    if: ${{ always() && needs.quality.result == 'success' && needs.preflight.result == 'success' && ((needs.preflight.outputs.state == 'IN_SYNC' && needs.integrity.result == 'success' && needs.integrity.outputs.result == 'PASS' && needs.apply.result == 'skipped' && needs.postflight.result == 'skipped') || (needs.preflight.outputs.state == 'PENDING' && needs.integrity.result == 'success' && (needs.integrity.outputs.result == 'PASS' || needs.integrity.outputs.result == 'MISMATCH') && needs.apply.result == 'success' && needs.postflight.result == 'success')) && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require latest main commit before deployment
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"
      - name: SCP Transfer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.production.yml, nginx-config"
          target: "~/receipt-manager"
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash <<'DEPLOY'
            set -euo pipefail
            cd ~/receipt-manager

            umask 077
            if [[ -L .env || ( -e .env && ! -f .env ) ]]; then
              echo ".env must be a regular file" >&2
              exit 1
            fi
            if [[ -e .env ]]; then
              chmod 600 -- .env
              if [[ "$(stat -c '%a' -- .env)" != 600 ]]; then
                echo ".env permissions are not 0600" >&2
                exit 1
              fi
            fi

            env_tmp="$(mktemp ./.env.tmp.XXXXXX)"
            trap 'rm -f -- "$env_tmp"' EXIT
            cat > "$env_tmp" <<'EOF'
            GEMINI_API_KEY=${{ secrets.PROD_GEMINI_API_KEY }}
            SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            EOF
            chmod 600 -- "$env_tmp"
            if [[ "$(stat -c '%a' -- "$env_tmp")" != 600 ]]; then
              echo "temporary .env permissions are not 0600" >&2
              exit 1
            fi
            mv -fT -- "$env_tmp" .env

            if [[ "$(stat -c '%a' -- .env)" != 600 ]]; then
              echo ".env permissions are not 0600" >&2
              exit 1
            fi

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
            for container in receipt-frontend receipt-backend; do
              status=$(docker inspect --format '{{.State.Status}}' "$container")
              if [[ "$status" != running ]]; then
                echo "$container is $status" >&2
                exit 1
              fi
            done
            docker image prune -f
            DEPLOY
